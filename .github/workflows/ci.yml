name: Code quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt ruff pytest

      - name: Check syntax and critical errors
        run: ruff check app.py config.py modules utils pages tests --select E9,F63,F7,F82

      - name: Compile Python sources
        run: python -m compileall -q app.py config.py modules utils pages tests

      - name: Run tests
        run: python -m pytest -q
